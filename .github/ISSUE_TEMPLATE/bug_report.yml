name: Bug report
description: Something is broken or behaving unexpectedly
labels: ["bug"]
body:
  - type: textarea
    id: what-happened
    attributes:
      label: What happened?
      description: What did you expect, and what happened instead?
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. ...
        2. ...
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Version / commit
      placeholder: e.g. v0.3.1 or commit sha
    validations:
      required: true
  - type: input
    id: deployment
    attributes:
      label: Deployment
      placeholder: docker compose / kubernetes / manual
  - type: textarea
    id: logs
    attributes:
      label: Relevant logs
      render: shell
